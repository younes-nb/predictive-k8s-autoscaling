# PBScaler controller Deployment (registry image; do NOT apply until the
# paper-mode RF is retrained — see pbscaler/README.md). Apply order:
#
#   kubectl apply -f pbscaler/deploy/rbac.yaml
#   kubectl apply -f pbscaler/deploy/deployment.yaml
#
# The image is pulled from docker.io (pushed by pbscaler/deploy/build_and_push.sh
# with the runner's docker credentials); the old side-loaded ctr copies on
# worker1 are no longer needed.
#
# Run-time behavior (paper modes: PBScaler IS the autoscaler while it runs):
#   * starts -> suspends the namespace HPAs itself (PBS_SUSPEND_HPAS=true)
#   * loop: 15 s anomaly (TopoRank + GA scale-out), 120 s waste (scale-in)
#   * on clean exit (duration end, SIGINT, SIGTERM) -> restores HPAs
#     (PBS_RESTORE_HPAS=true; also restorable by scripts/hpa_control.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbscaler
  namespace: train-ticket
  labels:
    app: pbscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pbscaler
  template:
    metadata:
      labels:
        app: pbscaler
    spec:
      serviceAccountName: pbscaler
      containers:
        - name: pbscaler
          image: docker.io/younesnb/pbscaler:v1.2.4   # v1.2.5 = v1.2.4 model + real Table III module timing
          # fullrun13_trace573_compress8 (TRACE_COMPRESS=8 + 44-core quota, 15.7%
          # viol regime; paper-comparable). Fixes v1.2.1 runaway (spec-based svc
          # counts, aligned GA bounds, write-path clamp).
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"                    # live prints for kubectl logs (block-buffered otherwise)
            - name: PBS_DURATION
              value: "46800"                # 13h — matches the evaluation run's k6 window (60min warmup + 720min)
            - name: PBS_SLO
              value: "200"                  # ms (paper Sec. IV-A4)
            - name: PBS_SLO_PREDICTOR
              value: "/app/simulation/train_ticket/RandomForestClassify.model"
            - name: PBS_SLO_PREDICTOR_SVCS
              value: "/app/simulation/train_ticket/RandomForestClassify.svcs"
            - name: PBS_MAX_POD
              value: "10"                   # keeps parity with existing HPAs
            - name: PBS_MIN_POD
              value: "1"
            - name: PBS_NAMESPACE
              value: "train-ticket"
            - name: PBS_FRONT_SVC
              value: "ts-ui-dashboard"
            - name: PBS_GATEWAY_NAME
              value: "train-ticket-gateway-istio"
            - name: PBS_SUSPEND_HPAS
              value: "true"                 # paper: PBScaler is the autoscaler during its run
            - name: PBS_RESTORE_HPAS
              value: "true"                 # restore native HPAs on clean exit
            - name: PBS_DRY_RUN
              value: "false"
            # in-cluster Mimir, no port-forward needed (monitoring ns)
            - name: PBS_MIMIR_URL
              value: "http://mimir.monitoring.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
