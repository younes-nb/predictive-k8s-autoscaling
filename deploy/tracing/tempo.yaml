apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-conf
  namespace: monitoring
data:
  tempo.yaml: |
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester_client:
      grpc_client_config:
        max_recv_msg_size: 4194304
        max_send_msg_size: 4194304
    compactor:
      compaction:
        block_retention: 336h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        pool:
          max_workers: 100
          queue_depth: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: docker.io/grafana/tempo:2.10.8
        args: ["-config.file=/conf/tempo.yaml"]
        ports:
        - {containerPort: 3100, name: http}
        - {containerPort: 9095, name: grpc}
        - {containerPort: 4317, name: otlp-grpc}
        - {containerPort: 4318, name: otlp-http}
        volumeMounts:
        - {name: conf, mountPath: /conf}
        - {name: data, mountPath: /var/tempo}
        resources:
          requests: {cpu: "200m", memory: "512Mi"}
          limits: {cpu: "1000m", memory: "2Gi"}
      volumes:
      - name: conf
        configMap:
          name: tempo-conf
      - name: data
        persistentVolumeClaim:
          claimName: tempo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
spec:
  selector:
    app: tempo
  ports:
  - {name: http, port: 3100, targetPort: 3100}
  - {name: grpc-otlp, port: 4317, targetPort: 4317}
  - {name: http-otlp, port: 4318, targetPort: 4318}
