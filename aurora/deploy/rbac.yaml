# RBAC for the AURORA-HPA controller.
#
# AURORA-HPA is the single replica writer for the workloads it manages: it
# suspends the namespace HPAs on start and restores them on exit, so it needs
# the same verbs PBScaler needs, plus nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora
  namespace: train-ticket
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aurora
  namespace: train-ticket
rules:
  # read deployments (service inventory, replica counts, resource config)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # the only write AURORA-HPA performs: the scale subresource
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # pod lifecycle: readiness, pending, startup time
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # suspend / restore the native HPAs while AURORA-HPA owns replicas
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # durable HPA state so a controller restart can still restore
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aurora
  namespace: train-ticket
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aurora
subjects:
  - kind: ServiceAccount
    name: aurora
    namespace: train-ticket